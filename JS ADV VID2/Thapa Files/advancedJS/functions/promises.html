<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style></style>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Welcome to Dad Jokes!</h1>
    <section class="api_body"></section>
    <button id="fetchJoke">Get Another Joke</button>
  </div>

  <script>
    const apiBody = document.querySelector(".api_body") ;
    const api1 = "https://icanhazdadjoke.com/";
    const fetchData = () => {
      fetch(api1 ,{
        headers :{
          Accept : 'application/json' ,
        },
      }).then((res) => {
        return res.json();
      }).then((data) => {
        apiBody.textContent = data.joke ;
      }).catch((err) => {
        console.log(err);
      });
    };
    fetchData();
    document.getElementById("fetchJoke").addEventListener('click', fetchData);
  </script>
</body>

</html>
